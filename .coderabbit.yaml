# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review config for rmems/agoge-forger (committed; applies to every non-draft PR).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!runs/**'
  - '!merged/**'
  - '!gguf/**'
  - '!adapters/**'
  - '!**/*.safetensors'
  - '!**/*.gguf'
  - '!**/*.pt'
  path_instructions:
  - path: '**/*.py'
    instructions: 'Python >=3.10 (CI uses 3.12; env managed with uv). Automatic PR Quality Gate: `uv pip install -e ".[dev]"` then `.venv/bin/ruff check .`, `.venv/bin/ruff format --check .`, `.venv/bin/mypy src/agoge_forger`, and `.venv/bin/pytest tests/`. Manual smoke (workflow_dispatch only, not a PR gate): `uv run python scripts/smoke_test.py --model <hf-id>`. Keep code compatible with the declared Python floor. The `consumer-contract` job runs CPU-only with `CUDA_VISIBLE_DEVICES=-1`; do not assume that mask for other tests or CI jobs (including the PR Quality Gate pytest run). Any torch/bitsandbytes/transformers path must still degrade to CPU or skip cleanly when no GPU is present, never assume a GPU at import time.'
  - path: pyproject.toml
    instructions: Dependencies are declared here and locked in `uv.lock`; do not add a second requirements file. Flag heavy new deps and first-party CUDA/Rust/Julia/Terraform additions (out of scope per AGENTS.md).
  - path: configs/**
    instructions: Top-level training configs (`configs/*.yaml`) are checked by the config-contract CI gate (`Path("configs").glob("*.yaml")` / `load_config`). The consumer-contract gate covers consumer parser paths and fixtures, not `configs/**`. Nested `configs/serving/**` and `configs/prompts/**` use other schemas and are not loaded by config-contract — flag schema or key changes there because they lack that CI coverage.
  - path: '**/Dockerfile'
    instructions: Dockerfile. Keep secrets out of layers and build args, and keep toolchain versions in line with the CI pins.
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too. Only the consumer-contract job currently sets `CUDA_VISIBLE_DEVICES=-1`; preserve that env where it already exists. Do not require the CUDA mask on other hosted workflows (pr_quality_gate, config_contract_gate, python_smoke_test, qodana) unless those jobs are explicitly moved onto the same CPU-only env contract.
  tools:
    ruff:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    pylint:
      enabled: false
    flake8:
      enabled: false
