# Measured Granite 4.1 QLoRA on R2EGym last-assistant freeze (outside configs/ CI glob).
# New experiment vs r2egym-cap512-last-assistant-v1: TRL chunked_nll + activation
# offload after 8192 QLoRA OOM on RTX 5080. Reuses the v1 frozen split (not copied;
# not re-split). max_seq_length stays 8192. Do not use 4096 (only 1 train row fits).
model_id: "ibm-granite/granite-4.1-3b-base"
revision: "dacb9cb9157bec98e99b09f285c92a4d58405c96"
trust_remote_code: false
dataset_path: "../r2egym-cap512-last-assistant-v1/pinned-split/splits/train.jsonl"
