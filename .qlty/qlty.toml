config_version = "0"

exclude_patterns = [
  "**/.git/**",
  "**/.venv/**",
  "**/build/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
]

test_patterns = [
  "tests/**",
  "**/test_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Pytest assertions are executable test expectations, not production checks
# that Python optimization can erase. Keep Bandit's B101 gate on src/ while
# excluding only this rule from test modules.
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**"]
set.ignored = true
