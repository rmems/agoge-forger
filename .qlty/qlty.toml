config_version = "0"

exclude_patterns = [
  "**/.git/**",
  "**/.venv/**",
  "**/build/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
]

test_patterns = [
  "tests/**",
  "**/test_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Pytest assertions are executable test expectations, not production checks
# that Python optimization can erase. Keep Bandit's B101 gate on src/ while
# excluding only this rule from test modules.
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**", "**/test_*.*"]
set.ignored = true

# Qlty Cloud attached Lob findings to blank/setup lines in synthetic filesystem
# tests. The same exact diff passes the repository secret hook and local
# TruffleHog scan, so ignore only this detector and only in tests.
[[triage]]
match.rules = ["trufflehog:Lob"]
match.file_patterns = ["tests/**", "**/test_*.*"]
set.ignored = true

# Transformers saves NumPy's legacy RandomState tuple and restores it through
# RandomState.set_state. This isolated instance validates that exact contract
# without mutating global RNG state; Generator uses an incompatible state shape.
[[triage]]
match.rules = ["radarlint-python:python:S6711"]
match.file_patterns = ["src/agoge_forger/_run_status_trainer_state.py"]
set.ignored = true
