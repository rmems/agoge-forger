[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agoge-forger"
version = "0.1.0"
description = "A reproducible Python/PyTorch platform for post-training, evaluation, and model release."
authors = [{name = "Raul Montoya Cardenas"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    # Transformers 5 / TRL 1 are hard floors: the trainer builds `trl.SFTConfig`
    # and reads `Trainer.processing_class`, neither of which exists earlier.
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "peft>=0.10.0",
    "trl>=1.0.0",
    "datasets>=2.19.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "pyyaml",
    "rich",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.4", "mypy>=1.0", "pre-commit"]

[project.scripts]
agoge = "agoge_forger.cli:app"

[project.urls]
Homepage = "https://github.com/rmems/agoge-forger"
Repository = "https://github.com/rmems/agoge-forger"
Issues = "https://github.com/rmems/agoge-forger/issues"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
