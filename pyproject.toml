[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agoge-forger"
version = "0.1.0"
description = "A Python/PyTorch-first platform for reproducible post-training, evaluation, and model releases."
authors = [{name = "Raul Montoya Cardenas"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["pytorch", "llm", "post-training", "sft", "qlora", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    # Transformers 5 / TRL 1 are hard floors: the trainer builds `trl.SFTConfig`
    # and reads `Trainer.processing_class`, neither of which exists earlier.
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "peft>=0.14.0",
    "trl>=1.0.0",
    "datasets>=2.19.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "pyyaml",
    "rich",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.4", "mypy>=1.0", "pre-commit"]

[project.scripts]
agoge = "agoge_forger.cli:app"

[project.urls]
Homepage = "https://github.com/rmems/agoge-forger"
Repository = "https://github.com/rmems/agoge-forger"
Issues = "https://github.com/rmems/agoge-forger/issues"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
