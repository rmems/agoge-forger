name: Qodana

on:
  workflow_dispatch:
  # No `branches:` filter. Restricting to PRs targeting main meant Qodana
  # silently never ran on a stacked PR — the gate reported nothing rather than
  # failing, so a stacked branch could look green on a check that never
  # executed. The other gates (pr_quality_gate, config_contract_gate) already
  # run on every pull request.
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Community Python only. qodana-python-community does not need Qodana Cloud,
  # so this job runs on Dependabot and fork pull requests as well as ordinary
  # ones. The paid Python linter required Ultimate Plus, and that membership has
  # expired.
  #
  # Never move this scan to pull_request_target: qodana.yaml can execute
  # repository-controlled bootstrap.
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR mode needs the source revision and full history to calculate the
          # merge base. Push/dispatch events have no pull_request payload.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Stage uv for Qodana bootstrap
        # Native Qodana sanitizes PATH but mounts its cache at /data/cache.
        env:
          UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: install -D -m 0755 "$UV_EXECUTABLE" "$RUNNER_TEMP/qodana/caches/bin/uv"

      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          # Pull requests fail on new problems; full main/release scans fail
          # on any problem now that the existing findings have been cleared.
          # The -e argument crosses QODANA_PYTHON_PATH into the native linter;
          # setting it only on this Actions step does not configure its SDK.
          pr-mode: ${{ github.event_name == 'pull_request' }}
          args: >-
            --within-docker false
            -e
            QODANA_PYTHON_PATH=/data/project/.venv/bin/python
            --fail-threshold 0
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          artifact-name: qodana-report
          cache-dir: ${{ runner.temp }}/qodana/caches
          cache-default-branch-only: true
          push-fixes: none
        # No QODANA_TOKEN / QODANA_ENDPOINT: Community does not talk to Cloud.
