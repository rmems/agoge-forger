name: Qodana

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "releases/*"

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    # QODANA_TOKEN and write-capable PR/check tokens are deliberately unavailable
    # to fork and Dependabot pull requests. Never move this scan to
    # pull_request_target: qodana.yaml can execute repository-controlled bootstrap.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR mode needs the source revision and full history to calculate the
          # merge base. Push/dispatch events have no pull_request payload.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Stage uv for Qodana bootstrap
        # Native Qodana sanitizes PATH but mounts its cache at /data/cache.
        env:
          UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: install -D -m 0755 "$UV_EXECUTABLE" "$RUNNER_TEMP/qodana/caches/bin/uv"

      - name: Qodana scan
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          # Pull requests fail on any newly reported problem. Full main/release
          # scans remain report-only until the existing debt has a baseline.
          pr-mode: ${{ github.event_name == 'pull_request' }}
          args: >-
            --within-docker false
            ${{ github.event_name == 'pull_request' && '--fail-threshold 0' || '' }}
          use-annotations: true
          post-pr-comment: true
          upload-result: true
          artifact-name: qodana-report
          cache-dir: ${{ runner.temp }}/qodana/caches
          cache-default-branch-only: true
          push-fixes: none
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_322213879 }}
          QODANA_ENDPOINT: "https://qodana.cloud"
          QODANA_PYTHON_PATH: /data/project/.venv/bin/python
