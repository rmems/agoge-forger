name: Python Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model ID"
        required: true
        default: "HuggingFaceM4/tiny-random-LlamaForCausalLM"
        type: string
      workload:
        description: "Workload type (inference, eval, inspect)"
        required: false
        default: "inference"
        type: choice
        options:
          - inference
          - eval
          - inspect
      max_requests:
        description: "Max inference requests"
        required: false
        default: "5"
        type: string
      concurrency:
        description: "Request concurrency"
        required: false
        default: "1"
        type: string
      stream:
        description: "Enable streaming"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry-run mode (no real inference)"
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: "Upload run artifacts"
        required: false
        default: true
        type: boolean
      trust_remote_code:
        description: "Allow Hugging Face to execute custom Python from the model repo"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        # Use `uv pip install -e .[dev]` rather than `uv sync --dev`
        # so the project is installed in editable mode and the test
        # scripts (which `from agoge_forger.X import Y`) can import
        # the package directly. `uv sync --dev` only installs the
        # dependencies, not the project itself.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Config check
        if: ${{ !inputs.dry_run }}
        run: |
          uv run python -c "
          from agoge_forger.config import load_config
          cfg = load_config('configs/minicpm5_canary.yaml')
          print(f'Config OK: model_id={cfg.model_id}')
          "

      - name: Run Python smoke test
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_WORKLOAD: ${{ inputs.workload }}
          INPUT_MAX_REQUESTS: ${{ inputs.max_requests }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_STREAM: ${{ inputs.stream }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TRUST_REMOTE_CODE: ${{ inputs.trust_remote_code }}
        run: |
          args=(
            --model "$INPUT_MODEL"
            --workload "$INPUT_WORKLOAD"
            --max-requests "$INPUT_MAX_REQUESTS"
            --concurrency "$INPUT_CONCURRENCY"
          )
          if [ "$INPUT_STREAM" = "true" ]; then
            args+=(--stream)
          else
            args+=(--no-stream)
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$INPUT_TRUST_REMOTE_CODE" = "true" ]; then
            args+=(--trust-remote-code)
          fi
          uv run python scripts/smoke_test.py "${args[@]}"

      - name: Upload artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-artifacts
          path: |
            smoke_output/manifest.json
            smoke_output/provider.json
            smoke_output/usage_before.json
            smoke_output/usage_after.json
            smoke_output/usage_delta.json
            smoke_output/results.jsonl
            smoke_output/summary.md
          retention-days: 14
          if-no-files-found: warn
