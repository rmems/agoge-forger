name: PR Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr_quality_gate.yml"

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Check lockfile consistency
        run: uv lock --check --python 3.14

      - name: Install dev dependencies
        # Frozen sync installs the locked dev extra and the editable project.
        run: uv sync --python 3.14 --frozen --extra dev

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy src/agoge_forger

      - name: Pytest
        run: .venv/bin/pytest tests/
