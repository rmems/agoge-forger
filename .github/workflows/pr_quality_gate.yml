name: PR Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr_quality_gate.yml"

permissions:
  contents: read

jobs:
  python-310-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install on the declared minimum Python
        run: |
          uv venv --python 3.10
          uv pip install -e .

      - name: Import public execution chains
        run: |
          .venv/bin/python - <<'PY'
          import agoge_forger.cli
          import agoge_forger.eval.contract
          import agoge_forger.split_contract
          import agoge_forger.split_materialize
          import agoge_forger.train.trainer
          PY

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        # Match security_scan.yml: editable install into .venv so pytest/ruff/mypy
        # are on PATH without `uv run` / `uv sync` spawn quirks.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy src/agoge_forger

      - name: Pytest
        run: .venv/bin/pytest tests/
