name: Aikido Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "rust-tools/**"
      - "infra/**"
      - ".github/workflows/aikido_security.yml"
      - ".github/workflows/snyk_security.yml"

permissions:
  contents: read

jobs:
  aikido-pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
      AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
    steps:
      - name: Set up Node.js
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Aikido CI API Client
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        run: npm install --global @aikidosec/ci-api-client@1.0.16

      - name: Aikido PR gating scan
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -n "$AIKIDO_CLIENT_API_KEY" ]; then
            API_KEY="$AIKIDO_CLIENT_API_KEY"
          else
            API_KEY="$AIKIDO_API_KEY"
          fi

          aikido-api-client scan "${{ github.repository_id }}" \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "$HEAD_REF" \
            --apikey "$API_KEY" \
            --pull-request-title "$PR_TITLE" \
            --pull-request-url "$PR_URL" \
            --minimum-severity-level=CRITICAL \
            --no-fail-on-dependency-scan

      - name: Skip (no Aikido CI API key configured)
        if: ${{ env.AIKIDO_CLIENT_API_KEY == '' && env.AIKIDO_API_KEY == '' }}
        run: echo "Set AIKIDO_CLIENT_API_KEY or AIKIDO_API_KEY to enable Aikido PR gating."

  aikido-release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
      AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Aikido CI API Client
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        run: npm install --global @aikidosec/ci-api-client@1.0.16

      - name: Aikido release gating scan
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' || env.AIKIDO_API_KEY != '' }}
        run: |
          if [ -n "$AIKIDO_CLIENT_API_KEY" ]; then
            API_KEY="$AIKIDO_CLIENT_API_KEY"
          else
            API_KEY="$AIKIDO_API_KEY"
          fi

          aikido-api-client scan-release "${{ github.repository_id }}" "${{ github.sha }}" \
            --apikey "$API_KEY" \
            --minimum-severity-level=CRITICAL \
            --no-fail-on-dependency-scan

      - name: Skip (no Aikido CI API key configured)
        if: ${{ env.AIKIDO_CLIENT_API_KEY == '' && env.AIKIDO_API_KEY == '' }}
        run: echo "Set AIKIDO_CLIENT_API_KEY or AIKIDO_API_KEY to enable Aikido release gating."