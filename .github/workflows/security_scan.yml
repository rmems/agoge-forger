name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        # `uv pip install -e .[dev]` (vs `uv sync --dev`) installs the
        # project in editable mode into a venv at `.venv`, and puts
        # pytest on PATH. This matches what `pytest tests/` needs
        # directly and avoids the "Failed to spawn: pytest" error
        # we hit when relying on `uv run` + `uv sync` together.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run pytest
        run: .venv/bin/pytest tests/
