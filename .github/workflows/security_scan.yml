name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "rust-tools/**"
      - "infra/**"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest tests/

      # Snyk SCA against the locked/installed environment (compliance PR #21).
      # `SNYK_TOKEN` must be configured as a repository secret. The step is
      # configured to never fail the build on Snyk findings so the gate stays
      # informational until token + policy are finalized.
      - name: Snyk SCA
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        run: |
          uv run --with snyk snyk test --all-projects --severity-threshold=medium || true

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)

      - name: Cargo check and clippy
        working-directory: rust-tools
        run: |
          cargo check
          cargo clippy -- -D warnings
