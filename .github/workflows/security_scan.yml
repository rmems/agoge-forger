name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "rust-tools/**"
      - "julia/**"
      - "Project.toml"
      - "Manifest.toml"
      - "infra/**"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        # `uv pip install -e .[dev]` (vs `uv sync --dev`) installs the
        # project in editable mode into a venv at `.venv`, and puts
        # pytest on PATH. This matches what `pytest tests/` needs
        # directly and avoids the "Failed to spawn: pytest" error
        # we hit when relying on `uv run` + `uv sync` together.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run pytest
        run: .venv/bin/pytest tests/

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v1 of dtolnay/rust-toolchain requires an explicit `toolchain`
      # input even for the implicit "stable" channel. The earlier
      # invocation with no `with:` block failed with
      # "'toolchain' is a required input".
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cargo check and clippy
        working-directory: rust-tools
        run: |
          cargo check
          cargo clippy -- -D warnings
