name: Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "rust-tools/**"
      - "julia/**"
      - "Project.toml"
      - "Manifest.toml"
      - "infra/**"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      # Hoist SNYK_TOKEN to the job level so the Snyk step's `if:` check
      # can see it. GitHub evaluates `if:` against the workflow + job env,
      # not the same step's `env:` block, so setting it only on the step
      # silently skips the gate on pull_request runs.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Reduce token exposure during PR execution; we don't push
          # from CI and don't need the auto-generated GITHUB_TOKEN
          # persisted in the local git config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest tests/

      # Snyk SCA against the locked/installed environment (compliance PR #21).
      # Uses the official snyk/actions/setup step to install the real Snyk
      # CLI (the previous `uv run --with snyk` invocation used a Python
      # wrapper, not the official binary, and the trailing `|| true` would
      # silently no-op on failure). The step is gated on SNYK_TOKEN being
      # configured as a repository secret; without it, the step is skipped
      # entirely so forks and unauthenticated PRs still pass the gate.
      - name: Snyk SCA
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk test
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=medium

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)

      - name: Cargo check and clippy
        working-directory: rust-tools
        run: |
          cargo check
          cargo clippy -- -D warnings
