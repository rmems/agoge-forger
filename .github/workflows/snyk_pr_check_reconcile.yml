name: Snyk PR Check Reconcile

# The Snyk GitHub App posts commit statuses (context: security/snyk (rmems)) that do not
# always honor the branch .snyk policy before merge. After a policy-gated CLI scan passes,
# post a success status for the same context so branch protection reflects repo policy.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  status:

concurrency:
  group: snyk-pr-reconcile-${{ github.event.pull_request.head.sha || github.event.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  reconcile-snyk-app:
    if: >-
      (github.event_name == 'status' &&
       github.event.context == 'security/snyk (rmems)' &&
       github.event.state == 'failure') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.sha }}
          persist-credentials: false

      - name: Wait for Snyk GitHub App
        if: github.event_name == 'pull_request'
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
              --jq '.statuses[] | select(.context=="security/snyk (rmems)") | .state' 2>/dev/null || true)
            if [ "$state" = "failure" ] || [ "$state" = "success" ]; then
              echo "Snyk App status: $state"
              echo "app_state=$state" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for Snyk App (${i}/60)..."
            sleep 10
          done
          echo "Snyk App did not report within 10 minutes"
          echo "app_state=pending" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        if: env.SNYK_TOKEN != ''
        with:
          enable-cache: true

      - name: Install dev dependencies
        if: env.SNYK_TOKEN != ''
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Snyk setup
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Policy-gated Snyk SCA
        if: env.SNYK_TOKEN != ''
        id: policy_test
        run: |
          set +e
          snyk test --file=requirements.txt --severity-threshold=medium --policy-path=.snyk
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::Policy-gated Snyk SCA failed (exit $code); not reconciling App status"
          fi
          exit 0

      - name: Reconcile Snyk App commit status
        if: >-
          env.SNYK_TOKEN != '' &&
          steps.policy_test.outputs.exit_code == '0' &&
          (github.event_name == 'status' || env.app_state == 'failure')
        run: |
          sha="${{ github.event.pull_request.head.sha || github.event.sha }}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state='success' \
            -f context='security/snyk (rmems)' \
            -f description='Policy-gated SCA passed (.snyk)' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}