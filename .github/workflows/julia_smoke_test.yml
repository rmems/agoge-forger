name: Julia Smoke Test

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Julia command to run"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - test
          - build
      project_dir:
        description: "Julia project directory (default: repo root)"
        required: false
        default: "."
        type: string
      julia_version:
        description: "Julia version"
        required: false
        default: "1.10"
        type: string
      dry_run:
        description: "Dry-run mode (validate environment only)"
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: "Upload run artifacts"
        required: false
        default: true
        type: boolean
  # Also run on PR changes to julia/ so the gate is exercised, not
  # only via manual dispatch. The PR trigger runs the `pr-smoke` job,
  # which only verifies that Julia can install on the runner; the
  # full smoke flow is still available via manual dispatch.
  pull_request:
    paths:
      - "julia/**"
      - ".github/workflows/julia_smoke_test.yml"
      - "Project.toml"
      - "Manifest.toml"

permissions:
  contents: read

jobs:
  # Minimal CI gate for PRs: just verify Julia can install and report
  # the version. No inputs are available on pull_request triggers,
  # so this is decoupled from the dispatch-driven full smoke flow.
  pr-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0

      - name: Report Julia version
        run: |
          mkdir -p julia_output
          julia --version | tee julia_output/manifest.json
          python3 -c "
          import json, os, sys
          from datetime import datetime, timezone
          m = {
            'timestamp': datetime.now(timezone.utc).isoformat(),
            'julia_version': open('julia_output/manifest.json').read().strip(),
            'event': 'pull_request',
          }
          json.dump(m, open('julia_output/manifest.json','w'), indent=2)
          "
          rm -f julia_output/manifest.json.bak

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: julia-pr-smoke-artifacts
          path: julia_output/
          retention-days: 7
          if-no-files-found: warn

  # Full smoke test (manual dispatch only): runs the full artifact
  # generation flow with all input-driven steps.
  julia-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ inputs.julia_version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0

      - name: Record before snapshot
        run: |
          mkdir -p julia_output
          python3 -c "
          import json, subprocess
          from datetime import timezone, datetime
          m = {
            'timestamp': datetime.now(timezone.utc).isoformat(),
            'git_commit': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
            'git_branch': subprocess.check_output(['git','rev-parse','--abbrev-ref','HEAD']).decode().strip(),
            'config': {
              'command': '${{ inputs.command }}',
              'project_dir': '${{ inputs.project_dir }}',
              'julia_version': '${{ inputs.julia_version }}',
              'dry_run': ${{ toJSON(inputs.dry_run) }}
            }
          }
          json.dump(m, open('julia_output/manifest.json','w'), indent=2)
          "

      - name: Record provider info
        run: |
          python3 -c "
          import json, os, sys
          from datetime import datetime, timezone
          p = {
            'timestamp': datetime.now(timezone.utc).isoformat(),
            'python_version': sys.version,
            'platform': sys.platform,
            'ci': os.getenv('CI','false') == 'true',
            'github_actions': os.getenv('GITHUB_ACTIONS','false') == 'true',
            'runner_os': os.getenv('RUNNER_OS','local'),
            'runner_arch': os.getenv('RUNNER_ARCH','unknown'),
          }
          json.dump(p, open('julia_output/provider.json','w'), indent=2)
          "

      - name: Record usage before
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          json.dump({
            'label': 'before',
            'timestamp': datetime.now(timezone.utc).isoformat(),
          }, open('julia_output/usage_before.json','w'), indent=2)
          "

      - name: Dry-run validation
        if: ${{ inputs.dry_run }}
        run: |
          julia --version
          echo "=== Dry-run: validating Julia environment ==="
          julia -e 'println("Julia OK: ", VERSION)'
          echo '{"status": "dry_run", "command": "check"}' > julia_output/results.jsonl

      - name: Run Julia check
        if: ${{ inputs.command == 'check' && !inputs.dry_run }}
        run: |
          julia --project=${{ inputs.project_dir }} -e '
          using Pkg
          Pkg.instantiate()
          Pkg.precompile()
          println("Julia environment check passed.")
          '
          echo '{"status": "ok", "command": "check"}' > julia_output/results.jsonl

      - name: Run Julia test
        if: ${{ inputs.command == 'test' && !inputs.dry_run }}
        run: |
          julia --project=${{ inputs.project_dir }} -e '
          using Pkg
          Pkg.instantiate()
          Pkg.test()
          '
          echo '{"status": "ok", "command": "test"}' > julia_output/results.jsonl

      - name: Run Julia build
        if: ${{ inputs.command == 'build' && !inputs.dry_run }}
        run: |
          julia --project=${{ inputs.project_dir }} -e '
          using Pkg
          Pkg.instantiate()
          Pkg.precompile()
          println("Build complete.")
          '
          echo '{"status": "ok", "command": "build"}' > julia_output/results.jsonl

      - name: Record usage after
        if: always()
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          json.dump({
            'label': 'after',
            'timestamp': datetime.now(timezone.utc).isoformat(),
          }, open('julia_output/usage_after.json','w'), indent=2)
          json.dump({
            'label': 'delta',
            'timestamp': datetime.now(timezone.utc).isoformat(),
          }, open('julia_output/usage_delta.json','w'), indent=2)
          "

      - name: Generate summary
        if: always()
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone
          results = []
          if os.path.exists('julia_output/results.jsonl'):
              with open('julia_output/results.jsonl') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          results.append(json.loads(line))

          status = 'ok' if results and all(r.get('status') in ('ok','dry_run') for r in results) else 'error'
          summary = [
            '# Julia Smoke Test Summary',
            '',
            '- **Command**: \`${{ inputs.command }}\`',
            '- **Julia version**: \`${{ inputs.julia_version }}\`',
            '- **Project dir**: \`${{ inputs.project_dir }}\`',
            '- **Mode**: ${{
              inputs.dry_run && 'dry-run' || 'live'
            }}',
            '- **Status**: ' + status,
            '',
            'Generated by Julia smoke test workflow  ',
            'Agent: Kilo agent OpenCode Go/MiniMax-M3',
          ]
          with open('julia_output/summary.md', 'w') as f:
              f.write('\n'.join(summary) + '\n')
          "

      - name: Upload artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: julia-smoke-test-artifacts
          path: julia_output/
          retention-days: 14
          if-no-files-found: warn
