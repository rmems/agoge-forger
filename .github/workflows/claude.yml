name: Claude

# Runs Claude Code when a maintainer mentions @claude on an issue, pull request
# or review. Model pinned to Fable 5.1 (rmems/agoge-forger#217).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  actions: write
  checks: write
  statuses: write
  discussions: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >-
      contains(github.event.comment.body || github.event.review.body, '@claude') &&
      !contains(github.event.comment.body || github.event.review.body, 'Generated by [Claude Code]') &&
      !contains(github.event.comment.body || github.event.review.body, 'Generated with [Claude Code]') &&
      !contains(github.event.comment.body || github.event.review.body, 'claude-workflow-comment') &&
      (github.event.comment.user.type || github.event.review.user.type) != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: a fine-grained PAT (Contents + Workflows: read/write) lets Claude edit
          # .github/workflows/. Empty when the secret is unset, so the action falls back to
          # the Claude GitHub App token.
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
          claude_args: |
            --model claude-fable-5-1
            --append-system-prompt "End every GitHub comment or review you write with the exact line <!-- claude-workflow-comment --> and never write the literal at-claude mention handle in anything you post."
            --allowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,Read,Glob,Grep,WebSearch,WebFetch,Task,TodoWrite"
