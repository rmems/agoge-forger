name: Snyk Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "rust-tools/**"
      - "infra/**"
      - ".github/workflows/snyk_security.yml"

concurrency:
  group: snyk-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk-python-sca:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Snyk setup
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Report-only until upstream transformers advisories have fixes (#37).
      - name: Snyk Python SCA (uv.lock)
        continue-on-error: true
        run: |
          set +e
          snyk test --file=uv.lock --package-manager=uv --severity-threshold=medium
          exit_code=$?
          if [ "$exit_code" -eq 2 ]; then
            echo "uv.lock scan failed with CLI/scan error (exit 2); falling back to requirements.txt"
            snyk test --file=requirements.txt --severity-threshold=medium
            exit $?
          fi
          exit "$exit_code"

  snyk-python-code:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Snyk setup
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk Code (Python)
        run: |
          set +e
          output=$(snyk code test src/ scripts/ \
            --severity-threshold=high \
            --sarif-file-output=snyk-python.sarif 2>&1)
          exit_code=$?
          echo "$output"
          if echo "$output" | grep -q 'SNYK-CODE-0005'; then
            echo "::warning::Snyk Code not enabled for this org; skipping Python SAST gate"
            exit 0
          fi
          exit "$exit_code"

      - name: Upload Python SARIF
        if: ${{ always() && hashFiles('snyk-python.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3c3833e0f8c1c83d449a7478aa59c036a9165498 # v3.29.11
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

  snyk-rust:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Snyk setup
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk Code (Rust)
        run: |
          set +e
          output=$(snyk code test rust-tools/ \
            --severity-threshold=high \
            --sarif-file-output=snyk-rust.sarif 2>&1)
          exit_code=$?
          echo "$output"
          if echo "$output" | grep -q 'SNYK-CODE-0005'; then
            echo "::warning::Snyk Code not enabled for this org; skipping Rust SAST gate"
            exit 0
          fi
          exit "$exit_code"

      - name: Upload Rust SARIF
        if: ${{ always() && hashFiles('snyk-rust.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3c3833e0f8c1c83d449a7478aa59c036a9165498 # v3.29.11
        with:
          sarif_file: snyk-rust.sarif
          category: snyk-rust

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust SBOMs
        id: generate-sboms
        working-directory: rust-tools
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename sbom
          mapfile -t sbom_files < <(find crates -name 'sbom.json' -type f | sort)
          if [ "${#sbom_files[@]}" -eq 0 ]; then
            echo "::error::cargo cyclonedx completed but produced no sbom.json files under rust-tools/crates"
            exit 1
          fi
          echo "Generated SBOM files:"
          printf '  %s\n' "${sbom_files[@]}"

      - name: Snyk SBOM test
        working-directory: rust-tools
        run: |
          set -euo pipefail
          mapfile -t sbom_files < <(find crates -name 'sbom.json' -type f | sort)
          if [ "${#sbom_files[@]}" -eq 0 ]; then
            echo "::error::No Rust SBOM files found under rust-tools/crates; SBOM generation produced zero files"
            exit 1
          fi
          for sbom in "${sbom_files[@]}"; do
            echo "Scanning $sbom"
            snyk sbom test --file="$sbom" --severity-threshold=medium
          done

  snyk-iac:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Snyk setup
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk IaC (Terraform)
        run: snyk iac test infra/terraform --severity-threshold=medium