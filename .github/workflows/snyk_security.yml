name: Snyk Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Julia (julia/**, Project.toml) is gated by security_scan.yml / julia_smoke_test.yml;
      # Snyk has no Julia scanner in this workflow.
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "rust-tools/**"
      - "infra/**"
      - ".github/workflows/snyk_security.yml"
      - ".snyk"

concurrency:
  group: snyk-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk-python-sca:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Snyk setup
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Report-only: uv.lock SCA needs Enterprise Early Access; fallback uses requirements.txt.
      # continue-on-error: step may exit 1 (vulns) but job still succeeds — intentional so
      # transformers/accelerate baseline issues do not block the workflow (see docs/ci_smoke_tests.md).
      # set +e: capture exit codes for uv.lock exit-2 fallback to requirements.txt.
      - name: Snyk Python SCA (uv.lock)
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        run: |
          set +e
          snyk test --file=uv.lock --package-manager=uv --severity-threshold=medium --policy-path=.snyk
          exit_code=$?
          if [ "$exit_code" -eq 2 ]; then
            echo "uv.lock scan failed with CLI/scan error (exit 2); falling back to requirements.txt"
            uv pip install -r requirements.txt
            snyk test --file=requirements.txt --severity-threshold=medium --policy-path=.snyk
            exit $?
          fi
          exit "$exit_code"

  snyk-python-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Snyk setup
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk Code (Python)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          set +e
          output=$(snyk code test src/ scripts/ \
            --severity-threshold=high \
            --sarif-file-output=snyk-python.sarif 2>&1)
          exit_code=$?
          echo "$output"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Snyk Code unavailable (exit 3); skipping Python SAST gate"
            exit 0
          fi
          if [ "$exit_code" -eq 2 ] && echo "$output" | grep -qE 'SNYK-CODE-0005|no supported files'; then
            echo "::warning::Snyk Code has no supported files; skipping Python SAST gate"
            exit 0
          fi
          exit "$exit_code"

      - name: Upload Python SARIF
        if: ${{ always() && env.SNYK_TOKEN != '' && hashFiles('snyk-python.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

  snyk-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Snyk setup
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk Code (Rust)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          set +e
          output=$(snyk code test rust-tools/ \
            --severity-threshold=high \
            --sarif-file-output=snyk-rust.sarif 2>&1)
          exit_code=$?
          echo "$output"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Snyk Code unavailable (exit 3); skipping Rust SAST gate"
            exit 0
          fi
          if [ "$exit_code" -eq 2 ] && echo "$output" | grep -qE 'SNYK-CODE-0005|no supported files'; then
            echo "::warning::Snyk Code has no supported files; skipping Rust SAST gate"
            exit 0
          fi
          exit "$exit_code"

      - name: Upload Rust SARIF
        if: ${{ always() && env.SNYK_TOKEN != '' && hashFiles('snyk-rust.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: snyk-rust.sarif
          category: snyk-rust

      - name: Install cargo-cyclonedx
        if: ${{ (success() || failure()) && env.SNYK_TOKEN != '' }}
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust SBOMs
        if: ${{ (success() || failure()) && env.SNYK_TOKEN != '' }}
        id: generate-sboms
        working-directory: rust-tools
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename sbom
          mapfile -t sbom_files < <(find crates -name 'sbom.json' -type f | sort)
          if [ "${#sbom_files[@]}" -eq 0 ]; then
            echo "::error::cargo cyclonedx completed but produced no sbom.json files under rust-tools/crates"
            exit 1
          fi
          echo "Generated SBOM files:"
          printf '  %s\n' "${sbom_files[@]}"

      - name: Snyk SBOM test
        if: ${{ steps.generate-sboms.outcome == 'success' && env.SNYK_TOKEN != '' }}
        working-directory: rust-tools
        run: |
          set -euo pipefail
          mapfile -t sbom_files < <(find crates -name 'sbom.json' -type f | sort)
          if [ "${#sbom_files[@]}" -eq 0 ]; then
            echo "::error::No Rust SBOM files found under rust-tools/crates; SBOM generation produced zero files"
            exit 1
          fi
          failed=0
          for sbom in "${sbom_files[@]}"; do
            echo "Scanning $sbom"
            if ! snyk sbom test --file="$sbom" --severity-threshold=medium; then
              failed=1
            fi
          done
          exit "$failed"


  snyk-iac:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Snyk setup
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk IaC (Terraform)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          if [ ! -d infra/terraform ] || [ -z "$(find infra/terraform -name '*.tf' -print -quit)" ]; then
            echo "::warning::No Terraform files under infra/terraform; skipping IaC scan"
            exit 0
          fi
          snyk iac test infra/terraform --severity-threshold=medium

  # Bypass Snyk GitHub App PR check when it fails (quota, policy drift) but in-repo jobs passed.
  # Skips when SNYK_TOKEN is unset (unconfigured forks) — secrets cannot gate job if: conditions.
  snyk-pr-check-reconcile:
    needs: [snyk-python-sca, snyk-python-code, snyk-rust, snyk-iac]
    if: >-
      github.event_name == 'pull_request' &&
      needs.snyk-python-sca.result == 'success' &&
      needs.snyk-python-code.result == 'success' &&
      needs.snyk-rust.result == 'success' &&
      needs.snyk-iac.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when Snyk is not configured
        id: snyk_configured
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN unset; skipping Snyk App bypass"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait briefly for Snyk GitHub App
        if: steps.snyk_configured.outputs.configured == 'true'
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 12); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" \
              --jq '.statuses[] | select(.context=="security/snyk (rmems)") | .state' 2>/dev/null | head -1 || true)
            if [ "$state" = "failure" ] || [ "$state" = "success" ] || [ "$state" = "error" ]; then
              echo "Snyk App status: $state"
              echo "app_state=$state" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for Snyk App (${i}/12)..."
            sleep 10
          done
          echo "::warning::Snyk App did not report within 2 minutes; bypassing App check"
          echo "app_state=pending" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bypass Snyk App commit status
        if: >-
          steps.snyk_configured.outputs.configured == 'true' &&
          env.app_state != 'success'
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state='success' \
            -f context='security/snyk (rmems)' \
            -f description='In-repo Snyk workflow passed; App check bypassed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}