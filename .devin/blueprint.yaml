# https://docs.devin.ai/onboard-devin/environment-yaml
# Repo-level environment for rmems/agoge-forger (Python + Rust).
# Commands run from the repo root.

initialize: |
  set -e
  # Pin and activate Rust for the rust-tools workspace.
  rustup toolchain install 1.97.1
  rustup default 1.97.1
  rustup component add --toolchain 1.97.1 rustfmt clippy llvm-tools-preview

  # Install uv if it is not present in the base image.
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  echo 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"' >> "$ENVRC"
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

  # Create a virtual environment and install the project in editable mode.
  uv venv
  uv pip install -e ".[dev]"

  # Pre-fetch Rust workspace dependencies.
  (cd rust-tools && cargo fetch)

maintenance: |
  set -e
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  uv pip install -e ".[dev]"
  (cd rust-tools && cargo fetch)

knowledge:
  - name: lint
    contents: |
      uv run ruff check .
      uv run mypy src/
      (cd rust-tools && cargo clippy --all-targets --all-features -- -D warnings)
  - name: test
    contents: |
      uv run pytest tests/
      (cd rust-tools && cargo test --all-features)
  - name: build
    contents: |
      (cd rust-tools && cargo build --all-features)
  - name: format
    contents: |
      uv run ruff format --check .
      (cd rust-tools && cargo fmt --check)
  - name: smoke
    contents: |
      uv run python scripts/smoke_test.py --model HuggingFaceM4/tiny-random-LlamaForCausalLM --workload inference --max-requests 3 --dry-run --output-dir smoke_output
